backend:
  name: github
  repo: Olmikaya/olmikaya
  branch: main
  base_url: https://olmikaya.pages.dev
  auth_endpoint: /api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "stories"
    label: "Stories"
    folder: "src/content/stories"
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["People", "Spaces", "Objects", "Table", "Culture", "Field Notes"], default: "People" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Pub Date", name: "pubDate", widget: "datetime", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
