# Build the Astro site and publish it to GitHub Pages.
#
# NOT IN USE. The site is hosted on Cloudflare Pages, which builds from the
# repo directly and serves from the domain root. This workflow is kept as a
# fallback and runs only when triggered by hand, so it no longer fails on
# every push.
#
# Two things to sort out before switching it back on:
#   1. Repo Settings -> Pages -> Source -> "GitHub Actions" (currently off).
#   2. This repo would publish to olmikaya.github.io/olmikaya/ — a sub-path —
#      and every internal link in the site is absolute, so they would all
#      404. Fix with a custom domain, or by renaming the repo to
#      Olmikaya.github.io. See the note in site/astro.config.mjs.

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
