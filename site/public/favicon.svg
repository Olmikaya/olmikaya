<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OLMIKAYA">
  <title>OLMIKAYA</title>

  <!--
    One letter, one colour pair: the O of OLMIKAYA, cream on the maroon the
    wordmark is set in. The wordmark is the site's most important mark, so
    the favicon is its first letter and nothing else.

    The O is drawn, not set. An SVG favicon cannot rely on a webfont, so Ovo
    — the display face the wordmark uses — would fall back to whatever serif
    the machine happens to have. These two ellipses carry the upright axis
    and the modest thick/thin contrast Ovo's O has, and render identically
    everywhere.

    fill-rule="evenodd" punches the counter out of the bowl, so the letter is
    one shape and stays a letter on any ground.
  -->

  <rect width="64" height="64" fill="#5C2020"/>

  <path fill="#F8E9C8" fill-rule="evenodd"
        d="M 13,32 A 19,21.5 0 0 1 51,32 A 19,21.5 0 0 1 13,32 Z
           M 19.8,32 A 12.2,17.8 0 0 1 44.2,32 A 12.2,17.8 0 0 1 19.8,32 Z"/>
</svg>
