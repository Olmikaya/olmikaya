# ---------------------------------------------------------------------------
# OLMIKAYA — CMS configuration (Sveltia CMS, Decap-compatible)
#
# These fields MIRROR the Zod schemas in src/content.config.ts. If you add a
# field there, add it here too — the admin will silently drop anything it does
# not know about when it saves.
#
# Signing in on the live site goes through our own OAuth worker; see the note
# on the backend below. Editing from localhost needs no login at all.
# ---------------------------------------------------------------------------

backend:
  name: github
  repo: Olmikaya/olmikaya
  branch: main

  # Signing in needs a server to swap the GitHub code for a token; that cannot
  # be done safely in the browser, so it runs on our own Cloudflare Worker
  # (github.com/sveltia/sveltia-cms-auth). Sveltia opens <base_url>/auth to
  # start the flow, and GitHub returns to <base_url>/callback — which is the
  # exact string registered as the callback URL on the OAuth app.
  #
  # The worker holds the GitHub client ID and secret, and ALLOWED_DOMAINS
  # restricts which sites may use it. Those live in the Cloudflare dashboard,
  # never in this repository.
  base_url: https://sveltia-cms-auth.ordinarylivingmadeintentional.workers.dev

# Work against the local folder instead of GitHub when the site is served
# from localhost. Lets you write and save articles with no login and no
# OAuth worker — Sveltia asks permission to open the project folder and
# edits the Markdown files directly. Harmless in production: it is ignored
# on any non-localhost host.
local_backend: true

# There is deliberately no `publish_mode: editorial_workflow` here. It opens a
# pull request for every save, which with a one-person masthead means reviewing
# your own work before it can reach the site. Publish commits straight to the
# branch above instead, and the `draft` switch on each entry is the only thing
# that decides whether it appears. Add the line back if writers are hired.

# Where uploaded photographs land. `media_folder` is relative to the repository
# root — the site lives in site/, so the path carries that prefix. The folder is
# kept in git with a .gitkeep so a fresh clone has somewhere to write to.
media_folder: "site/public/assets/img"
public_folder: "/assets/img"

collections:
  # -------------------------------------------------------------------------
  - name: articles
    label: Articles
    label_singular: Article
    folder: "site/src/content/articles"
    create: true
    slug: "{{slug}}"
    preview_path: "journal/{{slug}}"
    summary: "{{title}} — {{author}}, {{place}}"
    sortable_fields: [date, title, category]
    fields:
      - { name: title, label: Title, widget: string }
      - name: dek
        label: Standfirst
        widget: text
        hint: The one or two sentences under the headline. Keep it to about 30 words.
      - name: category
        label: Category
        widget: select
        options: [People, Places, Objects, Food, Style, Design, Architecture, Travel, Culture, Work, Ritual]
      - name: secondaryCategory
        label: Second category
        widget: select
        required: false
        options: [People, Places, Objects, Food, Style, Design, Architecture, Travel, Culture, Work, Ritual]
      - { name: author, label: Words by, widget: string }
      - { name: photographer, label: Photographs by, widget: string, required: false }
      - { name: place, label: Place, widget: string, hint: "City or town, e.g. Nairobi" }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - name: readingTime
        label: Reading time (minutes)
        widget: number
        required: false
        value_type: int
        min: 1
        hint: Leave blank and it is worked out from the length of the article.
      - { name: season, label: Season, widget: string, required: false }
      - name: cover
        label: Cover image
        widget: object
        hint: Leave the image empty and a palette plate holds the space until a photograph exists.
        fields:
          - { name: src, label: Image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false, hint: Describe the photograph for screen readers. }
          - { name: caption, label: Caption, widget: string, required: false }
          - { name: credit, label: Credit, widget: string, required: false }
          - { name: tone, label: Plate tone, widget: select, default: sky, options: [sky, cream, green, ink, terracotta, maroon] }
          - { name: ratio, label: Shape, widget: select, default: landscape, options: [portrait, square, landscape, wide, cinema] }
      - { name: featured, label: Featured as the lead story, widget: boolean, default: false }
      - name: draft
        label: Draft — hidden from the site
        widget: boolean
        default: true
        hint: >-
          Leave this on while you are still writing. The article is saved and
          committed either way; it does not appear anywhere on the site until
          this is switched OFF. This is the only switch that publishes it.
      - name: body
        label: Article
        widget: markdown
        hint: >-
          Use ## for section headings. A `>` blockquote becomes an OLMIKAYA
          pull-quote — to add an attribution, put it after a blank quote line
          so it renders as the small credit rather than part of the quote.

  # -------------------------------------------------------------------------
  - name: directory
    label: Directory
    label_singular: Entry
    folder: "site/src/content/directory"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{city}}"
    sortable_fields: [order, name, city]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: dek, label: Description, widget: text }
      - { name: city, label: City, widget: string }
      - { name: neighbourhood, label: Neighbourhood, widget: string, required: false }
      - name: relatedArticle
        label: Related article
        widget: relation
        required: false
        collection: articles
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
      - { name: visits, label: Times visited, widget: number, default: 1, value_type: int, min: 1, hint: Nothing is listed on a single visit. }
      - { name: order, label: Order, widget: number, default: 999, value_type: int }
      - name: draft
        label: Draft — hidden from the site
        widget: boolean
        default: true
        hint: Saved either way; it appears on the site only when this is OFF.

  # -------------------------------------------------------------------------
  - name: letters
    label: The letter
    label_singular: Issue
    folder: "site/src/content/letters"
    create: true
    slug: "{{slug}}"
    preview_path: "letter/{{slug}}"
    summary: "No. {{number}} — {{title}}"
    sortable_fields: [number, date]
    fields:
      - name: number
        label: Issue number
        widget: number
        value_type: int
        min: 1
        hint: As printed on the letter itself. One higher than the last one sent.
      - { name: title, label: Title, widget: string }
      - name: dek
        label: Standfirst
        widget: text
        hint: One or two sentences describing the issue, shown in the archive.
      - { name: date, label: Sent, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - name: draft
        label: Draft — hidden from the site
        widget: boolean
        default: true
        hint: Saved either way; it appears on the site only when this is OFF.
      - name: body
        label: The letter
        widget: markdown
        hint: >-
          The issue as it goes out. Publishing it here puts it in the public
          archive at /letter/ — it is not a private copy.

  # -------------------------------------------------------------------------
  - name: objects
    label: Objects
    label_singular: Object
    folder: "site/src/content/objects"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{availability}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: note, label: Note, widget: text }
      - { name: maker, label: Made with, widget: string, required: false }
      - name: kind
        label: Kind
        widget: string
        default: Objects
        hint: Groups the object in the shop filter bar. Reuse an existing kind where one fits.
      - name: availability
        label: Availability
        widget: string
        default: "Not yet released"
        hint: Free text, not a price. Nothing is for sale on this site yet.
      - name: relatedArticle
        label: Related article
        widget: relation
        required: false
        collection: articles
        search_fields: [title]
        value_field: "{{slug}}"
        display_fields: [title]
      - name: cover
        label: Image
        widget: object
        fields:
          - { name: src, label: Image, widget: image, required: false }
          - { name: alt, label: Alt text, widget: string, required: false }
          - { name: caption, label: Caption, widget: string, required: false }
          - { name: credit, label: Credit, widget: string, required: false }
          - { name: tone, label: Plate tone, widget: select, default: cream, options: [sky, cream, green, ink, terracotta, maroon] }
          - { name: ratio, label: Shape, widget: select, default: landscape, options: [portrait, square, landscape, wide, cinema] }
      - { name: order, label: Order, widget: number, default: 999, value_type: int }
      - name: draft
        label: Draft — hidden from the site
        widget: boolean
        default: true
        hint: Saved either way; it appears on the site only when this is OFF.

  # -------------------------------------------------------------------------
  - name: seasons
    label: Seasons
    label_singular: Season
    folder: "site/src/content/seasons"
    create: true
    slug: "{{slug}}"
    summary: "{{index}} — {{title}}"
    sortable_fields: [index]
    fields:
      - { name: index, label: Number, widget: number, value_type: int, min: 1 }
      - { name: title, label: Title, widget: string }
      - { name: question, label: The question, widget: text, hint: The single question everything in this season answers to. }
      - { name: dates, label: Running dates, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
